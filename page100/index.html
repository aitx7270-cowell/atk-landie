<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPA Route Watch test - Page 100</title>
  <script src="https://localhost:4566/shutto-translation-development3/trans.js?id=70"></script>
  <!-- Chrome Extension が導入タグを検出するためのテスト用タグ -->
  <script data-stt-id="spa-route-watch-test"></script>
  <style>
    :root {
      color: #182235;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      background: #f3f6fb;
      margin: 0;
      padding: 32px 16px;
    }

    main {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgb(24 34 53 / 12%);
      margin: auto;
      max-width: 760px;
      padding: 32px;
    }

    h1 { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    button {
      background: #1769e0;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      padding: 10px 14px;
    }
    button:hover { background: #0f56bd; }
    .status {
      background: #f1f5fb;
      border-left: 4px solid #1769e0;
      padding: 12px 16px;
    }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title">SPA Route Watch test: Page 100</h1>
    <p id="page-text">Đây là nội dung của Page 100. Hãy bắt đầu Manual Collection trước khi thử các nút bên dưới.</p>

    <section class="controls" data-stt-ignore>
      <button type="button" data-action="query">Chỉ đổi Query</button>
      <button type="button" data-action="fragment">Chỉ đổi Fragment</button>
      <button type="button" data-action="pathname">Đổi Pathname</button>
    </section>

    <section class="status" data-stt-ignore>
      <div>URL hiện tại: <code id="current-url"></code></div>
      <div>Page ID giả lập: <code id="current-page-id"></code></div>
      <div>Trạng thái fake 導入タグ: <code id="tag-status"></code></div>
    </section>
  </main>

  <script>
    ;(() => {
      function currentPageId () {
        return window.location.pathname.endsWith('/page200') ? '200' : '100'
      }

      function tagContent () {
        return `state=match;siteId=83613;pageId=${currentPageId()}`
      }

      function addSttInfo () {
        let meta = document.querySelector('meta[name="stt-info"]')
        if (!meta) {
          meta = document.createElement('meta')
          meta.name = 'stt-info'
          document.head.appendChild(meta)
        }
        meta.content = tagContent()
      }

      function removeSttInfo () {
        const meta = document.querySelector('meta[name="stt-info"]')
        if (meta) meta.remove()
      }

      function render () {
        const pageId = currentPageId()
        document.querySelector('#current-url').textContent = window.location.href
        document.querySelector('#current-page-id').textContent = pageId
        document.querySelector('#tag-status').textContent = document.querySelector('meta[name="stt-info"]')
          ? 'running'
          : 'stopped'
        document.querySelector('#page-title').textContent = `SPA Route Watch test: Page ${pageId}`
        document.querySelector('#page-text').textContent = `Đây là nội dung được render bởi SPA của Page ${pageId}.`
      }

      function updateUrl (url) {
        window.history.pushState({}, '', url)
        if (document.querySelector('meta[name="stt-info"]')) addSttInfo()
        render()
      }

      document.querySelector('[data-action="query"]').addEventListener('click', () => {
        updateUrl(`${window.location.pathname}?tab=details${window.location.hash}`)
      })

      document.querySelector('[data-action="fragment"]').addEventListener('click', () => {
        updateUrl(`${window.location.pathname}${window.location.search}#details`)
      })

      document.querySelector('[data-action="pathname"]').addEventListener('click', () => {
        updateUrl('/atk-landie/page200')
      })

      // Manual Collection の init / destroy を再現する最小限のテスト用ブリッジ。
      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || !event.data) return
        if (event.data.type === 'destroy') removeSttInfo()
        if (event.data.type === 'init') addSttInfo()
        render()
      })

      window.addEventListener('popstate', render)
      addSttInfo()
      render()
    })()
  </script>
</body>
</html>
